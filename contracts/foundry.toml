[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
# Deterministic metadata so a deployed contract can be matched to its source —
# the whole point of Reprod applied to our own artefacts.
cbor_metadata = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
coston2 = "https://coston2-api.flare.network/ext/C/rpc"
