name: Pages

# The registers describe a live network, so a page built once and left alone
# is not evidence of anything. This rebuilds every register from the committed
# evidence snapshots on every push, and republishes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Renderers only. `pnpm run build` would also re-scan the chain, which
      # needs live RPC and would make a publish fail for reasons that have
      # nothing to do with the page.
      - name: Render registers from committed evidence
        run: |
          pnpm --filter @therecord/covenant run render
          pnpm --filter @therecord/procedure run render
          pnpm --filter @therecord/procedure run render:backfill
          pnpm --filter @therecord/reprod run render
          pnpm --filter @therecord/design run build

      - name: Assemble the site
        run: bash scripts/assemble.sh _site

      - name: Fail if any internal link is dead
        run: python3 scripts/linkcheck.py _site

      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
